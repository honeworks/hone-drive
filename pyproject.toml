[project]
name = "hone-drive"
dynamic = ["version"]
description = "A storage dashboard for AI developers: drives and their links, model stores and caches, cache-bypassing benchmarks, model load times per drive, and advice with commands, on Linux, macOS and Windows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bahman Shadmehr", email = "info@bshadmehr.me" }]
keywords = [
    "ai", "llm", "storage", "ssd", "benchmark", "disk-usage", "ollama", "huggingface", "comfyui", "dashboard",
    "honeworks",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
# The design (design/changes/0001) adds psutil as a core dependency in milestone 1 (design/decisions.md
# D-001); the CLI uses argparse, so there is no `cli` extra (D-002).
dependencies = ["pydantic>=2.7"]

[dependency-groups]
# Development tools (PEP 735): installed by `uv sync`, never published as an extra.
dev = [
    "pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.3", "hypothesis>=6.100",
    "ruff>=0.6", "pyright>=1.1.380",
]

[project.urls]
Homepage = "https://github.com/honeworks/hone-drive"
Repository = "https://github.com/honeworks/hone-drive"
Issues = "https://github.com/honeworks/hone-drive/issues"
Changelog = "https://github.com/honeworks/hone-drive/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hone_drive/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hone_drive"]

[tool.hatch.build.targets.sdist]
include = [
    "src/", "tests/", "docs/", "examples/", "design/", "README.md", "CONTRIBUTING.md", "AGENTS.md",
    "LICENSE", "CHANGELOG.md", "pyproject.toml",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "S", "C4", "DTZ", "PL", "C90"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not bench'"
timeout = 120
markers = [
    "e2e: acceptance-case tests (run by default)",
    "bench: full-size benchmarks on real drives; run via scripts/gpu-lock.sh (design/decisions.md D-006)",
    "slow: slower than 5 s",
]

[tool.coverage.run]
branch = true
source = ["src/hone_drive"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]
